name: Daily finance posts

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.AUTO_AI_FOR_YOUNGJUNG }}
      OPENAI_MODEL: gpt-5.1
    steps:
      - uses: actions/checkout@v4

      - name: Generate and publish posts
        run: |
          python - <<'PY'
          import datetime as dt
          import html
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path
          from zoneinfo import ZoneInfo

          if not os.environ.get("OPENAI_API_KEY"):
              raise SystemExit("Add AUTO_AI_FOR_YOUNGJUNG in repository Settings > Secrets and variables > Actions")

          now = dt.datetime.now(ZoneInfo("Asia/Seoul"))
          today = now.date().isoformat()
          manifest_path = Path("posts/posts.json")
          posts = json.loads(manifest_path.read_text(encoding="utf-8")) if manifest_path.exists() else []

          prompt = f"""오늘은 한국시간 {today}이다. 한국어 재테크 블로그 '부자된 아서'에 올릴 원문 게시글 3개를 JSON으로 작성하라.
          정확히 국내주식 1개, 나스닥 1개, 기타 재테크 1개를 만든다.
          각 게시글의 bucket은 반드시 domestic, nasdaq, other 중 하나로 지정한다.
          기타 재테크는 절세·현금흐름·ETF·재테크 기초 중 하나를 선택한다.
          최신 숫자는 공식 자료를 우선하고, 기준일·핵심 숫자·위험요인·참고 링크·투자 권유가 아니라는 고지를 포함한다.
          제목은 명확하고 정보 중심으로 작성하며 낚시성·공포 조장·확정 수익 표현(예: 지금 사야, 무조건, 대박, 폭등, 현금은 왕이다)은 사용하지 않는다. 다른 블로그 문장을 복사하지 않고, 각 글의 분석·계산·해석을 독자적으로 작성한다.
          기존 글과 제목·문단·표·사례를 반복하지 말고, 각 글마다 오늘의 공식 출처에서 확인한 고유 숫자 2개 이상과 그 숫자의 의미를 설명한다.
          검색 노출만을 위한 일반론·상투적 문장·근거 없는 전망은 줄이고, 실제 독자가 실행할 수 있는 점검표나 계산 예시를 포함한다.
          각 글은 독립적으로 읽혀야 하며, 이미지와 본문 주제가 일치하고 동일한 이미지·문구의 반복을 피한다.
          모든 글은 기준 포맷(본문 16px, 모바일 15px, 제목 30~52px, 소제목 23~30px, 표 14px/모바일 12px)을 따르며 본문은 일반 굵기 중심으로 작성한다. 표 안에는 짧은 셀 값만 넣고, 표 설명·계산 해설·주의사항은 반드시 표 다음의 별도 p/ul/blockquote로 작성한다.
          body_html에는 p,h2,h3,strong,ul,li,table,thead,tbody,tr,th,td,blockquote,a만 사용하고 script/style/iframe/form과 onclick 등 이벤트 속성은 금지한다. 반드시 유효한 HTML로 작성하고 모든 여는 태그를 닫아야 하며, 표 안에는 표의 행·셀만 넣는다. Markdown 표 문법(| 구분자)은 사용하지 않는다.
          JSON 객체 하나만 반환한다:
          {{"posts":[{{"bucket":"domestic","slug":"english-slug","category":"국내주식 · 시장분석","categories":["국내주식","투자"],"title":"제목","excerpt":"두 문장 이내 요약","body_html":"<p>...</p>","sources":["https://..."]}}]}}"""

          payload = json.dumps({
              "model": os.environ.get("OPENAI_MODEL", "gpt-5.1"),
              "input": prompt
          }).encode()

          req = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["OPENAI_API_KEY"],
                  "Content-Type": "application/json"
              }
          )
          with urllib.request.urlopen(req, timeout=180) as resp:
              data = json.loads(resp.read().decode())

          text = data.get("output_text", "")
          if not text:
              text = "".join(
                  part.get("text", "")
                  for item in data.get("output", [])
                  for part in item.get("content", [])
                  if part.get("type") in ("output_text", "text")
              )
          text = re.sub(r"^\s*```(?:json)?\s*|\s*```\s*$", "", text.strip(), flags=re.S)
          generated = json.loads(text).get("posts", [])

          def bucket_for(item):
              declared = str(item.get("bucket", "")).strip().lower()
              if declared in {"domestic", "nasdaq", "other"}:
                  return declared
              categories = " ".join(str(x) for x in item.get("categories", []))
              category = str(item.get("category", ""))
              haystack = categories + " " + category
              if "국내주식" in haystack:
                  return "domestic"
              if "나스닥" in haystack or "미국주식" in haystack:
                  return "nasdaq"
              return "other"

          def cover_for(item, selected):
              categories = " ".join(str(x) for x in item.get("categories", []))
              category = str(item.get("category", ""))
              haystack = categories + " " + category
              if "국내주식" in haystack:
                  candidates = [
                      ("/assets/images/korean-stocks-cover.jpg", "국내주식과 반도체 시장을 분석하는 금융 사진"),
                      ("/assets/images/buja-market-illustration.png", "국내외 시장 흐름을 살펴보는 재테크 일러스트"),
                      ("/assets/images/finance-growth.svg", "시장 사이클과 자산 성장을 보여주는 금융 일러스트")
                  ]
              elif "나스닥" in haystack or "미국주식" in haystack:
                  candidates = [
                      ("/assets/images/nasdaq-cover.jpg", "나스닥 기술주 시장을 분석하는 트레이딩 데스크 사진"),
                      ("/assets/images/nasdaq-volatility-cover.jpg", "나스닥 변동성과 시장 폭을 보여주는 금융 사진"),
                      ("/assets/images/buja-market-illustration.png", "미국 기술주와 시장 차트를 살펴보는 재테크 일러스트")
                  ]
              elif "ETF" in haystack:
                  candidates = [
                      ("/assets/images/etf-cover.jpg", "ETF 분산투자 계획을 세우는 금융 사진"),
                      ("/assets/images/isa-cover.jpg", "ISA와 ETF 절세 전략을 비교하는 금융 계획 사진"),
                      ("/assets/images/finance-growth.svg", "ETF와 장기 자산 성장을 보여주는 금융 일러스트")
                  ]
              elif "절세" in haystack or "연말정산" in haystack:
                  candidates = [
                      ("/assets/images/tax-refund-cover.jpg", "연봉과 세액공제를 계산하는 금융 사진"),
                      ("/assets/images/isa-cover.jpg", "ISA와 연금저축 절세 전략을 비교하는 금융 계획 사진"),
                      ("/assets/images/fixed-costs-cover.jpg", "고정비와 월간 예산을 점검하는 생활 금융 사진"),
                      ("/assets/images/buja-market-illustration.png", "생활 재테크 계획을 세우는 금융 일러스트")
                  ]
              elif "연금" in haystack or "ISA" in haystack:
                  candidates = [
                      ("/assets/images/retirement-cover.jpg", "장기 투자와 연금저축을 상징하는 금융 사진"),
                      ("/assets/images/isa-cover.jpg", "ISA와 연금저축 절세 전략을 비교하는 금융 계획 사진"),
                      ("/assets/images/finance-growth.svg", "장기 자산 성장을 보여주는 금융 일러스트")
                  ]
              else:
                  candidates = [
                      ("/assets/images/fixed-costs-cover.jpg", "고정비와 월간 예산을 점검하는 생활 금융 사진"),
                      ("/assets/images/retirement-cover.jpg", "장기 투자와 연금저축을 상징하는 금융 사진"),
                      ("/assets/images/finance-growth.svg", "재테크와 자산 성장을 보여주는 금융 일러스트"),
                      ("/assets/images/buja-market-illustration.png", "월급 관리와 시장 흐름을 살펴보는 재테크 일러스트")
                  ]

              rotation = int(now.strftime("%d")) % len(candidates)
              ordered = candidates[rotation:] + candidates[:rotation]
              for candidate in ordered:
                  if candidate[0] not in selected:
                      return candidate
              return ordered[0]

          existing_buckets = {
              (p.get("date", "")[:10], bucket_for(p))
              for p in posts
          }
          selected_covers = set()
          added = 0

          for item in generated:
              bucket = bucket_for(item)
              if (today, bucket) in existing_buckets:
                  continue

              raw_slug = str(item.get("slug", "")).lower()
              slug = re.sub(r"[^a-z0-9-]+", "-", raw_slug).strip("-")
              category = str(item.get("category", "")).strip()
              title_raw = str(item.get("title", "")).strip()
              excerpt_raw = str(item.get("excerpt", "")).strip()
              if not slug or not category or not title_raw or not excerpt_raw:
                  continue

              title = html.escape(title_raw)
              excerpt = html.escape(excerpt_raw)
              body = str(item.get("body_html", ""))
              body = re.sub(r"<(script|style|iframe|form)\b[^>]*>.*?</\1>", "", body, flags=re.I | re.S)
              body = re.sub(r"\s+on[a-z]+\s*=\s*(['\"]).*?\1", "", body, flags=re.I | re.S)
              body = re.sub(r"javascript\s*:", "", body, flags=re.I)
              # Keep generated emphasis from leaking across malformed nested tags; base article text stays regular weight.
              body = re.sub(r"</?strong\b[^>]*>", "", body, flags=re.I)
              allowed = r"p|h2|h3|strong|ul|li|table|thead|tbody|tr|th|td|blockquote|a|em|br"
              body = re.sub(rf"<\/?(?!(?:{allowed})(?:\s|>|/))[^>]+>", "", body, flags=re.I)
              def repair_tables(fragment):
                  table_re = re.compile(
                      r"<table\b[^>]*>[\s\S]*?(?:</table\s*>|(?=<(?:p|h[1-6]|ul|ol|blockquote|div|footer)\b|</main>))",
                      flags=re.I
                  )
                  row_re = re.compile(
                      r"<tr\b[^>]*>([\s\S]*?)(?=<tr\b|</table\s*>|$)",
                      flags=re.I
                  )
                  cell_re = re.compile(
                      r"<(th|td)\b[^>]*>([\s\S]*?)(?=<(?:th|td|tr)\b|</tr\s*>|</thead\s*>|</tbody\s*>|</table\s*>|$)",
                      flags=re.I
                  )

                  def normalize_table(match):
                      raw = match.group(0)
                      rows = []
                      for row_match in row_re.finditer(raw):
                          cells = []
                          for cell_match in cell_re.finditer(row_match.group(1)):
                              cell = re.sub(r"\s+", " ", cell_match.group(2)).strip()
                              if cell:
                                  cells.append(cell)
                          if cells:
                              rows.append(cells)
                      if not rows:
                          return raw
                      header = "".join(f"<th>{cell}</th>" for cell in rows[0])
                      body_rows = "".join(
                          "<tr>" + "".join(f"<td>{cell}</td>" for cell in row) + "</tr>"
                          for row in rows[1:]
                      )
                      return f"<table><thead><tr>{header}</tr></thead><tbody>{body_rows}</tbody></table>"

                  return table_re.sub(normalize_table, fragment)

              body = repair_tables(body)

              def close_open_tags(fragment):
                  tag_re = re.compile(r"<(/?)(p|h2|h3|ul|ol|li|table|thead|tbody|tr|th|td|blockquote|a|em|strong|br)(?:\s[^>]*)?>", re.I)
                  void_tags = {"br"}
                  stack = []
                  out = []
                  cursor = 0
                  block_tags = {"p", "h2", "h3", "blockquote", "table", "ul", "ol"}
                  for match in tag_re.finditer(fragment):
                      out.append(fragment[cursor:match.start()])
                      closing, tag = match.group(1), match.group(2).lower()
                      token = match.group(0)
                      if closing:
                          if tag in stack:
                              while stack and stack[-1] != tag:
                                  out.append(f"</{stack.pop()}>")
                              if stack:
                                  stack.pop()
                              out.append(token)
                          cursor = match.end()
                          continue
                      if tag == "li":
                          while stack and stack[-1] == "li":
                              out.append("</li>")
                              stack.pop()
                      if tag in {"p", "h2", "h3", "blockquote"}:
                          while stack and stack[-1] in {"p", "h2", "h3", "blockquote"}:
                              out.append(f"</{stack.pop()}>")
                      if tag in {"th", "td"}:
                          while stack and stack[-1] in {"th", "td"}:
                              out.append(f"</{stack.pop()}>")
                      if tag == "tr":
                          while stack and stack[-1] in {"th", "td"}:
                              out.append(f"</{stack.pop()}>")
                          if stack and stack[-1] == "tr":
                              out.append("</tr>")
                              stack.pop()
                      out.append(token)
                      if tag not in void_tags:
                          stack.append(tag)
                      cursor = match.end()
                  out.append(fragment[cursor:])
                  while stack:
                      out.append(f"</{stack.pop()}>")
                  return "".join(out)

              body = close_open_tags(body)

              def validate_article(fragment):
                  tags = ("p", "h1", "h2", "h3", "ul", "ol", "li", "table", "thead", "tbody", "tr", "th", "td", "blockquote")
                  for tag in tags:
                      opened = len(re.findall(rf"<{tag}\b", fragment, flags=re.I))
                      closed = len(re.findall(rf"</{tag}>", fragment, flags=re.I))
                      if opened != closed:
                          raise SystemExit(f"Invalid HTML: {tag} open={opened} close={closed}")
                  for table_match in re.finditer(r"<table\b[^>]*>([\s\S]*?)</table>", fragment, flags=re.I):
                      if re.search(r"</?(?:p|h[1-6]|ul|ol|li|blockquote|div)\b", table_match.group(1), flags=re.I):
                          raise SystemExit("Invalid table: explanatory content must be outside the table")
              
              validate_article(body)
              sources = item.get("sources", [])
              source_items = "".join(
                  f'<li><a href="{html.escape(str(url), quote=True)}">{html.escape(str(url))}</a></li>'
                  for url in sources[:8]
                  if str(url).startswith(("https://", "http://"))
              )
              body += (
                  "<h2>공식 출처</h2><ul>" + source_items + "</ul>"
                  f'<p class="note">분석 기준일: {today} · 위 출처와 공개 자료를 바탕으로 작성했습니다.</p>'
                  '<p class="note">이 글은 일반 정보이며 특정 금융상품의 매수·매도를 권유하지 않습니다. 투자 전에는 최신 공식 자료와 자신의 상황을 확인하세요.</p>'
              )

              image, alt = cover_for(item, selected_covers)
              selected_covers.add(image)
              page = f'''<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{title} · 부자된 아서</title><style>:root{{--bg:#f7f8fa;--card:#fff;--ink:#17191c;--body:#3b424c;--line:#e6eaf0;--blue:#3182f6;--soft:#eef5ff}}[data-theme=dark]{{--bg:#0d1117;--card:#151b24;--ink:#f4f7fb;--body:#d7dde7;--line:#2a3442;--blue:#8ab4ff;--soft:#192a43}}*{{box-sizing:border-box}}body{{margin:0;background:var(--bg);color:var(--body);font:16px/1.75 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}}.wrap{{max-width:920px;margin:auto;padding:28px 20px 72px}}header{{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}}.brand,a{{color:var(--blue)}}.brand{{font-weight:800;text-decoration:none;font-size:20px}}button{{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);padding:9px 14px}}main{{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,5vw,48px)}}.eyebrow{{color:var(--blue);font-weight:800}}h1,h2,h3{{color:var(--ink);font-weight:750;letter-spacing:-.045em}}h1{{font-size:clamp(30px,5vw,52px);line-height:1.2;margin:.45em 0 .4em}}h2{{font-size:clamp(23px,3vw,30px);line-height:1.35;margin:2.2em 0 .7em}}h3{{font-size:clamp(18px,2.2vw,22px);line-height:1.45;margin:1.7em 0 .55em}}p{{margin:1em 0}}ul{{padding-left:1.25em;margin:1em 0}}li{{margin:.45em 0}}strong{{font-weight:650;color:var(--ink)}}.post-cover{{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:18px;margin:22px 0 30px}}@media(max-width:620px){{body{{font-size:15px}}.wrap{{padding:18px 14px 48px}}header{{margin-bottom:22px}}header .brand{{font-size:18px}}button{{font-size:13px;padding:8px 11px}}main{{border-radius:18px;padding:20px 16px}}h1{{font-size:clamp(27px,8vw,39px);line-height:1.25}}h2{{font-size:23px;line-height:1.4;margin-top:1.9em}}h3{{font-size:18px;line-height:1.45}}p,li{{overflow-wrap:anywhere}}table{{font-size:12px;width:100%;table-layout:fixed;display:table;white-space:normal;overflow:visible;word-break:break-word}}th,td{{padding:7px 5px;overflow-wrap:anywhere;word-break:break-word}}.post-cover{{margin:18px 0 24px;border-radius:14px}}img{{border-radius:14px}}}}.post-meta{{color:#7b8490;font-size:13px;margin:10px 0 18px}}img{{display:block;width:100%;border-radius:18px;margin:24px 0}}table{{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px;line-height:1.55;table-layout:fixed}}th,td{{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top;overflow-wrap:anywhere;word-break:break-word}}th{{background:var(--soft);color:var(--ink);font-weight:650}}.note{{color:#7b8490;font-size:13px}}footer{{text-align:center;color:#7b8490;font-size:13px;margin-top:24px}}</style><style id="readability">:root{{font-synthesis:none}}html{{-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}}body{{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Roboto,Arial,sans-serif;letter-spacing:-.02em}}h1,h2,h3{{letter-spacing:-.045em}}p,li,td,th{{letter-spacing:-.018em;overflow-wrap:anywhere}}@media(max-width:620px){{body{{font-size:15px;line-height:1.72}}h1,h2,h3{{letter-spacing:-.05em}}p,li,td,th{{letter-spacing:-.022em}}}}</style></head><body><div class="wrap"><header><a class="brand" href="/">부자된 아서</a><button id="theme">☾ 다크모드</button></header><main><div class="eyebrow">{html.escape(category)}</div><h1>{title}</h1><p>{excerpt}</p><div class="post-meta">분석 기준일: {today} · 공식 자료 확인 기준</div><img class="post-cover" src="{image}" alt="{html.escape(alt, quote=True)}">{body}</main><footer><a href="/">← 홈으로 돌아가기</a> · <a href="/about.html">운영자 소개</a> · <a href="/contact.html">문의하기</a> · <a href="/privacy.html">개인정보처리방침</a></footer></div><script>const r=document.documentElement,b=document.getElementById("theme"),k="buja-theme";function s(t){{r.dataset.theme=t;b.textContent=t==="dark"?"☀ 라이트모드":"☾ 다크모드"}}s(localStorage.getItem(k)||"light");b.onclick=()=>{{let t=r.dataset.theme==="dark"?"light":"dark";localStorage.setItem(k,t);s(t)}};</script></body></html>'''

              path = Path("posts") / f"{today}-{slug}.html"
              suffix = 2
              while path.exists():
                  path = Path("posts") / f"{today}-{slug}-{suffix}.html"
                  suffix += 1
              path.write_text(page, encoding="utf-8")
              posts.insert(0, {
                  "date": now.isoformat(),
                  "category": category,
                  "categories": item.get("categories", []),
                  "title": title_raw,
                  "excerpt": excerpt_raw,
                  "image": image,
                  "alt": alt,
                  "url": "/" + str(path)
              })
              existing_buckets.add((today, bucket))
              added += 1

          if added != 3:
              raise SystemExit(f"Expected 3 new posts (domestic, nasdaq, other), but created {added}")

          posts.sort(key=lambda p: p.get("date", ""), reverse=True)
          manifest_path.write_text(json.dumps(posts, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
