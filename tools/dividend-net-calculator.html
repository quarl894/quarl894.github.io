<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="투자금과 배당수익률·세율로 세전·세후 배당 현금흐름을 계산합니다."><title>배당 세후 현금흐름 계산기 · 부자된 아서</title><style>:root{--bg:#f7f8fa;--card:#fff;--ink:#17191c;--body:#3b424c;--muted:#7b8490;--line:#e6eaf0;--blue:#3182f6;--soft:#eef5ff}[data-theme=dark]{--bg:#0d1117;--card:#151b24;--ink:#f4f7fb;--body:#d7dde7;--muted:#9aa6b5;--line:#2a3442;--blue:#8ab4ff;--soft:#192a43}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--body);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;font-size:16px;line-height:1.75}.wrap{max-width:920px;margin:auto;padding:28px 20px 72px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{color:var(--blue);font-weight:750;text-decoration:none;font-size:20px}.toggle{border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);padding:9px 14px;cursor:pointer}main{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(24px,5vw,52px)}h1,h2,h3{color:var(--ink);font-weight:750;letter-spacing:-.045em}h1{font-size:clamp(30px,5vw,52px);line-height:1.2}h2{font-size:clamp(23px,3vw,30px);margin-top:2em}a{color:var(--blue)}.eyebrow{color:var(--blue);font-weight:700;font-size:14px}.tool-form{display:grid;gap:14px;margin:24px 0}.field{display:grid;grid-template-columns:1fr 180px;align-items:center;gap:14px}.field label{color:var(--ink);font-weight:650}.field input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:11px;font:inherit}.calc-btn{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}.result{margin:22px 0;padding:18px;background:var(--soft);border-radius:14px;color:var(--ink)}.result strong{font-size:24px}.note{color:var(--muted);font-size:13px}blockquote{border-left:4px solid var(--blue);background:var(--soft);margin:24px 0;padding:14px 18px;border-radius:0 12px 12px 0}footer{text-align:center;color:var(--muted);font-size:13px;margin-top:24px}@media(max-width:620px){body{font-size:15px}.wrap{padding:18px 14px 48px}main{padding:20px 16px;border-radius:18px}.field{grid-template-columns:1fr}.field input{font-size:16px}}</style></head><body><div class="wrap"><header><a class="brand" href="/">부자된 아서</a><button class="toggle" id="theme">☾ 다크모드</button></header><main><div class="eyebrow">계산도구 · 배당</div><h1>배당 세후 현금흐름 계산기</h1><p>투자금과 배당수익률을 입력해 세전·세후 연간 및 월간 현금흐름을 계산합니다.</p><div class="tool-form"><div class="field"><label>투자금(원)<input id="p" type="number" value="10000000"></label><label>배당수익률(%)<input id="y" type="number" value="4.6" step="0.1"></label><label>원천징수 세율(%)<input id="t" type="number" value="15.4" step="0.1"></label><button class="calc-btn" id="run">계산하기</button></div></div><div class="result" id="out">값을 입력하고 계산해 보세요.</div><p class="note">배당률이 1년 유지된다는 단순 가정입니다. 배당금은 보장되지 않으며 개인별 금융소득 과세에 따라 결과가 달라질 수 있습니다.</p></main><footer><a href="/">← 홈으로 돌아가기</a> · <a href="/tools.html">계산도구 모음</a> · <a href="/about.html">운영자 소개</a> · <a href="/privacy.html">개인정보처리방침</a></footer></div><script>const r=document.documentElement,b=document.getElementById("theme"),t=localStorage.getItem("buja-theme")||"light";r.dataset.theme=t;b.textContent=t==="dark"?"☀ 라이트모드":"☾ 다크모드";b.onclick=()=>{const n=r.dataset.theme==="dark"?"light":"dark";r.dataset.theme=n;localStorage.setItem("buja-theme",n);b.textContent=n==="dark"?"☀ 라이트모드":"☾ 다크모드"};const f=n=>Math.round(n).toLocaleString("ko-KR");document.getElementById("run").onclick=()=>{const p=+document.getElementById("p").value||0,y=(+document.getElementById("y").value||0)/100,t=(+document.getElementById("t").value||0)/100,g=p*y,n=g*(1-t);document.getElementById("out").innerHTML="세전 연간 배당<br><strong>"+f(g)+"원</strong><br><br>세후 연간 배당<br><strong>"+f(n)+"원</strong><br><br>세후 월평균: "+f(n/12)+"원"};</script>></body></html>
